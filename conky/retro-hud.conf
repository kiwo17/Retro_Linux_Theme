conky.config = {
    alignment = 'top_middle',
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 190,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    update_interval = 2,
    total_run_times = 0,
    double_buffer = true, 
    use_xft = true,
    font = 'Monospace:size=11',
    default_color = '00FF00',
    color1 = '00FF00',
    color2 = '2F6FED',
    color3 = 'FF3B3B',
    color4 = '39D4FF',
    minimum_width = 400,
}

conky.text = [[
${voffset 4}${color4}${hr 1}${color}
${voffset 6}${alignc}${color1}››› SYSTEM ONLINE ‹‹‹${color}
${voffset 8}${alignc}${color4}${time %H:%M:%S}${color} ${color1}●${color}${color4}${time %A, %d %B}${color}
${voffset 8}${color1}${hr 1}${color}
${voffset 10}${cpugraph cpu0 30,180 00FF00 39D4FF}${goto 210}${memgraph 30,180 00FF00 39D4FF}
${voffset 4}${color1}CPU${color} ${cpu}%${goto 210}${color1}RAM${color} ${mem} / ${memmax}
${voffset 8}${color4}${hr 1}${color}
]]